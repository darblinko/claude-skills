name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pattern tests, figure freshness, skill layout and relative links
        run: uv run pytest -q

  markdown-to-pdf:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20.19.0 is the minimum the lockfile allows (entities 8.1.0).
        node-version: ['20.19.0', '22']
    defaults:
      run:
        working-directory: skills/markdown-to-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: skills/markdown-to-pdf/package-lock.json
      - run: npm ci
      - name: Install the Chromium build that matches the pinned playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Install poppler-utils for PDF inspection
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render smoke tests
        run: npm test
