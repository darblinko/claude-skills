name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pattern tests, skill layout and relative links
        run: uv run pytest -q

  markdown-to-pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/markdown-to-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/markdown-to-pdf/package-lock.json
      - run: npm ci
      - name: Install the Chromium build that matches the pinned playwright-core
        run: npx playwright-core install --with-deps chromium
      - name: Render smoke tests
        run: npm test
